name: Uitrollen

# Productie bij een merge naar main. De preview per pull request staat hier niet meer: die
# bouwt de job Code van de Kwaliteitspoort (ci.yml), met de openbare testwaarden en zonder
# sleutels, en preview-uitrollen.yml (altijd de versie van main) uploadt dat met de
# preview-sleutel. Zo wordt een PR één keer gebouwd, en ziet code uit een PR nooit een sleutel.
#   production  CLOUDFLARE_API_TOKEN (alleen uitrollen), vars VITE_*, CLOUDFLARE_ACCOUNT_ID
#   preview     een eigen CLOUDFLARE_API_TOKEN (alleen uitrollen), CLOUDFLARE_ACCOUNT_ID;
#               alleen gebruikt door preview-uitrollen.yml
#   repo-vars   PREVIEW_VITE_*: de openbare waarden van de test (ze staan toch in de bundel);
#               gelezen door de job Code in ci.yml
# De omgevingen production en preview zijn beperkt tot main.
on:
  push:
    branches: [main]

concurrency:
  group: uitrollen-${{ github.ref }}
  # Een productie-uitrol wordt nooit afgebroken.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  productie:
    name: Productie
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Is alles ingericht?
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        # bash voor de vergelijking met =~ hieronder.
        shell: bash
        run: |
          node scripts/guard-cloudflare.mjs
          # Zonder DSN staat de foutbewaking stil uit; dan hoor je een storing pas als iemand
          # belt. Geen reden om niet uit te rollen, wel om het bij elke uitrol hardop te zeggen.
          if [ -z "$VITE_SENTRY_DSN" ]; then
            echo "::warning::Foutbewaking (Sentry) staat uit voor deze app: VITE_SENTRY_DSN ontbreekt in omgeving production."
          elif ! [[ "$VITE_SENTRY_DSN" =~ ^https://[0-9a-f]+@o[0-9]+\.ingest(\.[a-z]+)?\.sentry\.io/[0-9]+$ ]]; then
            echo "::warning::VITE_SENTRY_DSN ziet er niet uit als een DSN van Sentry; controleer de waarde in omgeving production."
          fi
          modus=$(node -e "import('./scripts/lib/stack-config.mjs').then((m) => console.log(m.databaseModus()))")
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN ontbreekt in omgeving production. Uitrollen wordt overgeslagen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$modus" != "geen" ] && [ -z "$VITE_SUPABASE_URL" ]; then
            # Nooit live zonder database-instellingen: dan zou de app open staan voordat
            # de inrichting (Access, inlogdienst) er is.
            echo "::notice::VITE_SUPABASE_URL ontbreekt in omgeving production. De app is nog niet ingericht; uitrollen wordt overgeslagen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip != 'true'
        uses: pnpm/action-setup@v6

      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Bouwen
        if: steps.check.outputs.skip != 'true'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SCHEMA: ${{ vars.VITE_SUPABASE_SCHEMA }}
          VITE_INLOGDIENST: ${{ vars.VITE_INLOGDIENST }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: pnpm build

      - name: Uitrollen naar Cloudflare
        if: steps.check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy
